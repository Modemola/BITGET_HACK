[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackout-desk"
version = "0.1.0"
description = "Closure-window risk desk for tokenized US stocks"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "exchange_calendars>=4.5",
    "requests>=2.31",
]

[project.optional-dependencies]
# `agent` carries the MCP SDK, which only the agent-facing server needs. It is
# in `dev` as well so CI exercises that server rather than skipping it: an
# integration nobody runs is an integration that quietly stops working.
agent = ["mcp>=2.0"]
dev = ["pytest>=8.0", "pyyaml>=6.0", "mcp>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
  "slow: spawns a subprocess; still run by default, marked so it can be deselected with -m 'not slow' while iterating",
]
